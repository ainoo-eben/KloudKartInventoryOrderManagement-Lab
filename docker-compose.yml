services:
  db:
    image: postgres:16
    container_name: kloudkart-db
    # race_test.py opens 400 simultaneous connections (flash-sale test).
    # PostgreSQL's default of 100 makes ~300 of them fail with "too many
    # clients". 500 leaves headroom for psql/admin sessions. See ADR-009.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres      # match whatever race_test.py expects
      POSTGRES_DB: kloudkart
    ports:
      - "5432:5432"                    # use "5433:5432" if 5432 is already taken on your machine
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps the data between restarts
      - ./data:/data:ro               # your bundle files, read-only inside the container
      - ./sql:/sql:ro                     # your numbered SQL files
volumes:
  pgdata: